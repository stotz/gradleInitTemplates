[versions]
# Version constraints (npm/semver syntax):
#   @pin            = never update (default)
#   @*              = always update to latest
#   @^1.2.3         = minor updates (>=1.2.3 <2.0.0)
#   @~1.2.3         = patch updates (>=1.2.3 <1.3.0)
#   @>=1.0.0        = minimum version
#   @<2.0.0         = maximum version
#   @>=1.0 <2.0     = range
#   @1.x            = any 1.x version

# This is the multiproject root catalog. It intentionally contains only the
# universal base: the JDK toolchain, Kotlin and the kotlin-jvm plugin used by
# buildSrc. Subproject templates merge their own versions, libraries and
# plugins on 'gradleInit subproject', so the catalog only ever lists what is
# actually used by the subprojects you add.

# Gradle wrapper version policy (value in gradle/wrapper/gradle-wrapper.properties)
# gradle {{ version_policy }}

# JDK version for toolchain
jdk = "{{ @@03|(24|25)|JDK version=25@@jdk_version }}"
# https://mvnrepository.com/artifact/org.jetbrains.kotlin/kotlin-stdlib {{ version_policy }}
kotlin = "{{ kotlin_version }}"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
