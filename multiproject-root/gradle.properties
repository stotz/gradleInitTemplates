# Project-wide Gradle settings

# JDK version for all subprojects
jdkVersion = {{ @@03|(24|25)|JDK version=25@@jdk_version }}

# Gradle settings
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = true

# Toolchain discovery. The project toolchain ('jdk' in gradle/libs.versions.toml)
# must be an installed JDK; Gradle finds it through environment variables named
# after the CI convention JAVA_HOME_<major>_X64 (GitHub Actions / Azure set them
# automatically; set them yourself on developer machines). Auto-download is off
# so builds are deterministic and work offline.
#org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
org.gradle.java.installations.auto-download=false
