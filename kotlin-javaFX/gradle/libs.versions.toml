[versions]
# Version constraints (npm/semver syntax):
#   @pin            = never update (default)
#   @*              = always update to latest
#   @^1.2.3         = minor updates (>=1.2.3 <2.0.0)
#   @~1.2.3         = patch updates (>=1.2.3 <1.3.0)
#   @>=1.0.0        = minimum version
#   @<2.0.0         = maximum version
#   @>=1.0 <2.0     = range
#   @1.x            = any 1.x version

# JDK version for toolchain
jdk = "{{ @@01|(21|23|25)|JDK version (21, 23, or 25)=25@@jdk_version }}"
# https://mvnrepository.com/artifact/org.jetbrains.kotlin/kotlin-stdlib @pin
kotlin = "2.3.10"
# https://mvnrepository.com/artifact/com.gradleup.shadow/shadow-gradle-plugin @pin
shadow = "9.3.2"
# https://mvnrepository.com/artifact/org.beryx.jlink/org.beryx.jlink.gradle.plugin @pin
beryx_jlink = "3.1.5"
# https://mvnrepository.com/artifact/org.openjfx/javafx-base @pin
javafx = "25.0.2"
# https://mvnrepository.com/artifact/org.kordamp.ikonli/ikonli-javafx @pin
ikonli = "12.4.0"
# https://mvnrepository.com/artifact/com.dlsc.formsfx/formsfx-core @pin
formsfx = "11.6.0"
# https://mvnrepository.com/artifact/org.controlsfx/controlsfx @pin
controlsfx = "11.2.3"
# https://mvnrepository.com/artifact/net.synedra/validatorfx @pin
validatorfx = "0.6.3"
# https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter @pin
junit = "6.0.3"
# https://mvnrepository.com/artifact/org.assertj/assertj-core @pin
assertj = "3.27.7"
# https://mvnrepository.com/artifact/io.mockk/mockk @pin
mockk = "1.14.9"

[libraries]
javafx-base = { module = "org.openjfx:javafx-base", version.ref = "javafx" }
javafx-graphics = { module = "org.openjfx:javafx-graphics", version.ref = "javafx" }
javafx-controls = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
javafx-web = { module = "org.openjfx:javafx-web", version.ref = "javafx" }
controlsfx = { module = "org.controlsfx:controlsfx", version.ref = "controlsfx" }
formsfx-core = { module = "com.dlsc.formsfx:formsfx-core", version.ref = "formsfx" }
validatorfx = { module = "net.synedra:validatorfx", version.ref = "validatorfx" }
ikonli-javafx = { module = "org.kordamp.ikonli:ikonli-javafx", version.ref = "ikonli" }
ikonli-fontawesome5 = { module = "org.kordamp.ikonli:ikonli-fontawesome5-pack", version.ref = "ikonli" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
beryx-jlink = { id = "org.beryx.jlink", version.ref = "beryx_jlink" }
