[versions]
# Version constraints (npm/semver syntax):
#   @pin            = never update (default)
#   @*              = always update to latest
#   @^1.2.3         = minor updates (>=1.2.3 <2.0.0)
#   @~1.2.3         = patch updates (>=1.2.3 <1.3.0)
#   @>=1.0.0        = minimum version
#   @<2.0.0         = maximum version
#   @>=1.0 <2.0     = range
#   @1.x            = any 1.x version

# Gradle wrapper version policy (value in gradle/wrapper/gradle-wrapper.properties)
# gradle {{ version_policy }}

# JDK version for toolchain
jdk = "{{ @@03|(24|25)|JDK version=25@@jdk_version }}"
# https://mvnrepository.com/artifact/org.jetbrains.kotlin/kotlin-stdlib {{ version_policy }}
kotlin = "{{ kotlin_version }}"
# https://mvnrepository.com/artifact/com.gradleup.shadow/shadow-gradle-plugin {{ version_policy }}
shadow = "9.4.2"
# https://mvnrepository.com/artifact/org.beryx.jlink/org.beryx.jlink.gradle.plugin {{ version_policy }}
beryx_jlink = "3.1.5"
# https://mvnrepository.com/artifact/org.openjfx/javafx-base {{ version_policy }}
javafx = "26.0.1"
# https://mvnrepository.com/artifact/org.kordamp.ikonli/ikonli-javafx {{ version_policy }}
ikonli = "12.4.0"
# https://mvnrepository.com/artifact/com.dlsc.formsfx/formsfx-core {{ version_policy }}
formsfx = "11.6.0"
# https://mvnrepository.com/artifact/org.controlsfx/controlsfx {{ version_policy }}
controlsfx = "11.2.3"
# https://mvnrepository.com/artifact/net.synedra/validatorfx {{ version_policy }}
validatorfx = "0.6.3"
# https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter {{ version_policy }}
junit = "6.1.0"
# https://mvnrepository.com/artifact/org.assertj/assertj-core {{ version_policy }}
assertj = "3.27.7"
# https://mvnrepository.com/artifact/io.mockk/mockk {{ version_policy }}
mockk = "1.14.11"

[libraries]
javafx-base = { module = "org.openjfx:javafx-base", version.ref = "javafx" }
javafx-graphics = { module = "org.openjfx:javafx-graphics", version.ref = "javafx" }
javafx-controls = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
javafx-web = { module = "org.openjfx:javafx-web", version.ref = "javafx" }
controlsfx = { module = "org.controlsfx:controlsfx", version.ref = "controlsfx" }
formsfx-core = { module = "com.dlsc.formsfx:formsfx-core", version.ref = "formsfx" }
validatorfx = { module = "net.synedra:validatorfx", version.ref = "validatorfx" }
ikonli-javafx = { module = "org.kordamp.ikonli:ikonli-javafx", version.ref = "ikonli" }
ikonli-fontawesome5 = { module = "org.kordamp.ikonli:ikonli-fontawesome5-pack", version.ref = "ikonli" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
beryx-jlink = { id = "org.beryx.jlink", version.ref = "beryx_jlink" }
