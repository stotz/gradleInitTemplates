[versions]
# Version constraints (npm/semver syntax):
#   @pin            = never update (default)
#   @*              = always update to latest
#   @^1.2.3         = minor updates (>=1.2.3 <2.0.0)
#   @~1.2.3         = patch updates (>=1.2.3 <1.3.0)
#   @>=1.0.0        = minimum version
#   @<2.0.0         = maximum version
#   @>=1.0 <2.0     = range
#   @1.x            = any 1.x version

# Gradle wrapper version policy (value in gradle/wrapper/gradle-wrapper.properties)
# gradle {{ version_policy }}

# JDK version for toolchain
jdk = "{{ @@03|(24|25)|JDK version=25@@jdk_version }}"
# https://mvnrepository.com/artifact/org.jetbrains.kotlin/kotlin-stdlib {{ version_policy }}
kotlin = "{{ kotlin_version }}"
# https://mvnrepository.com/artifact/com.gradleup.shadow/shadow-gradle-plugin {{ version_policy }}
shadow = "9.4.2"
# https://mvnrepository.com/artifact/org.springframework.boot/spring-boot {{ version_policy }}
spring-boot = "4.1.0"
# https://mvnrepository.com/artifact/io.spring.gradle/dependency-management-plugin {{ version_policy }}
spring-dependency-management = "1.1.7"
# https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api {{ version_policy }}
junit = "6.1.0"
# https://mvnrepository.com/artifact/org.assertj/assertj-core {{ version_policy }}
assertj = "3.27.7"
# https://mvnrepository.com/artifact/io.mockk/mockk {{ version_policy }}
mockk = "1.14.11"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
