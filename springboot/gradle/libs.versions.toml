[versions]
# JDK version for toolchain
jdk = "{{ @@03|(21|24|25)|JDK version=24@@jdk_version }}"
# https://kotlinlang.org/
kotlin = "{{ kotlin_version }}"
# https://mvnrepository.com/artifact/com.gradleup.shadow/shadow-gradle-plugin
shadow = "9.3.1"
# https://spring.io/projects/spring-boot
spring-boot = "4.0.2"
# https://mvnrepository.com/artifact/io.spring.gradle/dependency-management-plugin
spring-dependency-management = "1.1.7"
# https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api
junit = "5.12.2"
# https://mvnrepository.com/artifact/org.assertj/assertj-core
assertj = "3.27.7"
# https://mvnrepository.com/artifact/io.mockk/mockk
mockk = "1.14.9"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
