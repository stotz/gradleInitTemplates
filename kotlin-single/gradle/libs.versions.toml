[versions]
# Version constraints (npm/semver syntax):
#   @pin            = never update (default)
#   @*              = always update to latest
#   @^1.2.3         = minor updates (>=1.2.3 <2.0.0)
#   @~1.2.3         = patch updates (>=1.2.3 <1.3.0)
#   @>=1.0.0        = minimum version
#   @<2.0.0         = maximum version
#   @>=1.0 <2.0     = range
#   @1.x            = any 1.x version

# Gradle wrapper version policy (value in gradle/wrapper/gradle-wrapper.properties)
# gradle {{ version_policy }}

# JDK version for toolchain
jdk = "{{ @@03|(24|25)|JDK version=25@@jdk_version }}"
# https://mvnrepository.com/artifact/org.jetbrains.kotlin/kotlin-stdlib {{ version_policy }}
kotlin = "{{ kotlin_version }}"
{% if enable_kover %}
# https://mvnrepository.com/artifact/org.jetbrains.kotlinx/kover-gradle-plugin {{ version_policy }}
kover = "0.9.11"
{% endif %}
{% if enable_sbom %}
# https://plugins.gradle.org/plugin/org.cyclonedx.bom {{ version_policy }}
cyclonedx = "3.4.1"
{% endif %}
# https://mvnrepository.com/artifact/com.gradleup.shadow/shadow-gradle-plugin {{ version_policy }}
shadow = "9.6.1"
{% if enable_clikt %}
# https://mvnrepository.com/artifact/com.github.ajalt.clikt/clikt {{ version_policy }}
clikt = "5.1.0"
{% endif %}
# https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api {{ version_policy }}
junit = "6.1.3"
# https://mvnrepository.com/artifact/org.assertj/assertj-core {{ version_policy }}
assertj = "3.27.7"
# https://mvnrepository.com/artifact/io.mockk/mockk {{ version_policy }}
mockk = "1.14.11"

[libraries]
{% if enable_clikt %}
# Clikt CLI framework with Markdown help rendering
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
clikt-markdown = { module = "com.github.ajalt.clikt:clikt-markdown", version.ref = "clikt" }
{% endif %}
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
{% if enable_sbom %}
cyclonedx-bom = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
{% endif %}
{% if enable_kover %}
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
{% endif %}
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
