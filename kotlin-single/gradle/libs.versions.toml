[versions]
# Version constraints (npm/semver syntax):
#   @pin            = never update (default)
#   @*              = always update to latest
#   @^1.2.3         = minor updates (>=1.2.3 <2.0.0)
#   @~1.2.3         = patch updates (>=1.2.3 <1.3.0)
#   @>=1.0.0        = minimum version
#   @<2.0.0         = maximum version
#   @>=1.0 <2.0     = range
#   @1.x            = any 1.x version

# JDK version for toolchain
jdk = "{{ @@03|(11|17|21|25)|JDK version=25@@jdk_version }}"
# https://mvnrepository.com/artifact/org.jetbrains.kotlin/kotlin-stdlib @pin
kotlin = "2.3.10"
# https://mvnrepository.com/artifact/com.gradleup.shadow/shadow-gradle-plugin @pin
shadow = "9.3.2"
# https://mvnrepository.com/artifact/com.github.ajalt.clikt/clikt @pin
clikt = "5.1.0"
# https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api @pin
junit = "6.0.3"
# https://mvnrepository.com/artifact/org.assertj/assertj-core @pin
assertj = "3.27.7"
# https://mvnrepository.com/artifact/io.mockk/mockk @pin
mockk = "1.14.9"

[libraries]
# Clikt CLI framework with Markdown help rendering
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
clikt-markdown = { module = "com.github.ajalt.clikt:clikt-markdown", version.ref = "clikt" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
