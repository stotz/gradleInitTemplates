# Gradle daemon JVM criteria (Gradle 8.13+): the JDK that runs Gradle and
# compiles buildSrc. Independent of the project toolchain ('jdk' in
# gradle/libs.versions.toml), so a legacy toolchain such as 8 can be paired
# with a modern daemon. Offline: that JDK must be installed and discoverable.
{% if jdk_version|int >= 17 %}toolchainVersion={{ jdk_version }}{% else %}toolchainVersion=25{% endif %}
